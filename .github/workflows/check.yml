name: Great Energy 15є
on:
  schedule:
    - cron: "*/15 * * * *"   # канал SvitloGreat кожні 15 хв, графік ДТЕК раз на годину
  workflow_dispatch:
    inputs:
      force:
        description: "Надіслати поточний графік навіть без змін"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python dtek_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND: ${{ inputs.force && '1' || '0' }}
      - name: Зберегти стан
        if: always()
        run: |
          git config user.name "great-energy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Оновити стан бота"
          git pull --rebase && git push
