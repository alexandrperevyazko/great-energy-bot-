name: Great Energy 15є
# Бот працює безперервно: кожен запуск триває ~5,5 год (канал кожні 2 хв, графік ДТЕК щогодини),
# а в кінці сам запускає наступний. Розклад нижче лише страхує, якщо ланцюжок обірветься.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Надіслати поточний графік навіть без змін"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Бот
        run: python dtek_bot.py --loop
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_MINUTES: "320"
          PYTHONUNBUFFERED: "1"
      - name: Зберегти стан
        if: always()
        run: |
          git config user.name "great-energy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Оновити стан бота"
          git pull --rebase && git push
      - name: Запустити наступний цикл
        if: always()
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/check.yml/dispatches" \
            -d '{"ref":"main"}'
